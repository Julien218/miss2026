name: Refresh Multer lockfile

on:
  push:
    branches:
      - security/multer-lock-refresh
    paths:
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/refresh-multer-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    if: ${{ !contains(github.event.head_commit.message, '[skip lock-refresh]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: security/multer-lock-refresh
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm 10.4.1
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate
          pnpm --version

      - name: Regenerate lockfile only
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Verify Multer 2.3.0 in lockfile
        run: |
          grep -q "multer@2.3.0" pnpm-lock.yaml
          grep -A3 "multer:" pnpm-lock.yaml | grep -q "2.3.0"

      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "Refresh pnpm lock for Multer 2.3.0 [skip lock-refresh]"
          git push origin HEAD:security/multer-lock-refresh
